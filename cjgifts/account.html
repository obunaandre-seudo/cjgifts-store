<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>My Account</h1>
    <div class="crumb"><a href="index.html">Home</a> / Account</div>
  </div>
</div>

<section class="section">
  <div class="container" style="max-width:900px;">
    <div class="admin-panel" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
      <div>
        <h3 style="margin-bottom:2px;" id="accName"></h3>
        <span style="color:var(--gray-600);font-size:14px;" id="accEmail"></span>
      </div>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
    </div>

    <div class="admin-panel">
      <h3>Profile Details</h3>
      <form id="profileForm">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input id="profileName"></div>
          <div class="form-group"><label>Email</label><input id="profileEmail" disabled style="background:var(--gray-100);"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input id="profilePhone"></div>
          <div class="form-group"><label>City</label><input id="profileCity"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Address</label><input id="profileAddress"></div>
          <div class="form-group"><label>Country</label><input id="profileCountry"></div>
        </div>
        <button type="submit" class="btn btn-navy">Save Changes</button>
      </form>
    </div>

    <h3 style="margin:34px 0 16px;">Order History</h3>
    <div id="ordersList"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderLayout('');
  initAccountPage();
</script>
</body>
</html>
