<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="hamburger" id="adminMenuToggle" style="display:none;"><span></span><span></span><span></span></div>
        <h1>Dashboard Overview</h1>
      </div>
      <a href="../index.html" target="_blank" class="btn btn-outline btn-sm">View Store ↗</a>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">🛍️</div><div class="stat-value" id="statProducts">0</div><div class="stat-label">Total Products</div></div>
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value" id="statOrders">0</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="statCustomers">0</div><div class="stat-label">Total Customers</div></div>
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" id="statRevenue">$0</div><div class="stat-label">Total Revenue</div></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:1fr;margin-bottom:24px;">
      <div class="stat-card" style="display:flex;align-items:center;gap:16px;">
        <div class="stat-icon">⏳</div>
        <div><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending / Processing Orders</div></div>
      </div>
    </div>

    <div class="admin-panel">
      <h3>Recent Orders</h3>
      <table class="data-table">
        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="recentOrdersBody"></tbody>
      </table>
    </div>

    <div class="admin-panel">
      <h3>Recently Added Products</h3>
      <table class="data-table">
        <thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
        <tbody id="recentProductsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminDashboard();
</script>
</body>
</html>
