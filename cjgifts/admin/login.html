<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="auth-wrap" style="min-height:100vh;">
  <div class="auth-card">
    <div class="logo" style="justify-content:center;margin-bottom:6px;color:var(--navy);"><span class="mark">CJ</span>Admin Panel</div>
    <p class="sub">Sign in to manage CJ Gifts</p>
    <div class="form-error" id="adminLoginError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="adminLoginForm">
      <div class="form-group"><label>Username</label><input id="adminUsername" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="adminPassword" required></div>
      <button type="submit" class="btn btn-gold btn-block">Login to Dashboard</button>
    </form>
    <p style="text-align:center;font-size:12.5px;color:var(--gray-600);margin-top:16px;">Demo credentials: <b>admin</b> / <b>admin123</b></p>
    <div class="auth-switch"><a href="../index.html">&larr; Back to Store</a></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminLoginPage();
</script>
</body>
</html>
