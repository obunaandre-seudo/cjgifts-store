<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — CJ Gifts Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <a href="add-product.html" class="btn btn-gold btn-sm">+ Add Product</a>
    </div>

    <div class="admin-panel">
      <div class="toolbar" style="margin-bottom:20px;">
        <input type="search" id="adminProductSearch" placeholder="Search by name or SKU..." style="padding:10px 14px;border:1px solid var(--gray-200);border-radius:8px;min-width:240px;">
        <select id="adminCategoryFilter">
          <option value="">All Categories</option>
          <option value="gift-ideas">Gift Ideas</option>
          <option value="products-accessories">Products &amp; Accessories</option>
        </select>
      </div>
      <table class="data-table">
        <thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="adminProductsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminProductsPage();
</script>
</body>
</html>
