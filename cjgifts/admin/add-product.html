<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product — CJ Gifts Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="formTitle">Add New Product</h1>
      <a href="products.html" class="btn btn-outline btn-sm">← Back to Products</a>
    </div>

    <form id="productForm">
      <div class="admin-form-grid">
        <div>
          <div class="admin-panel">
            <h3>Basic Information</h3>
            <div class="form-group"><label>Product Name *</label><input id="fName" required></div>
            <div class="form-group"><label>Short Description</label><input id="fShortDesc" placeholder="One-line summary shown on product cards"></div>
            <div class="form-group"><label>Full Description</label><textarea id="fDesc" rows="5"></textarea></div>
            <div class="form-row">
              <div class="form-group"><label>SKU *</label><input id="fSku" required></div>
              <div class="form-group"><label>Stock Quantity *</label><input id="fStock" type="number" min="0" required></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Price ($) *</label><input id="fPrice" type="number" step="0.01" min="0" required></div>
              <div class="form-group"><label>Sale Price ($)</label><input id="fSalePrice" type="number" step="0.01" min="0" placeholder="Optional"></div>
            </div>
          </div>

          <div class="admin-panel">
            <h3>Product Images</h3>
            <div class="image-upload-zone" id="imageUploadZone">
              <p style="margin:0;font-weight:700;color:var(--navy);">Click to upload images</p>
              <p style="margin:4px 0 0;font-size:12.5px;">PNG or JPG — first image becomes the primary image</p>
            </div>
            <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;">
            <div class="image-preview-grid" id="imagePreviewGrid"></div>
          </div>

          <div class="admin-panel">
            <h3>Variants <span style="font-weight:400;font-size:13px;color:var(--gray-600);">(optional)</span></h3>
            <div id="variantsWrap"></div>
            <button type="button" class="btn btn-outline btn-sm" id="addVariantBtn">+ Add Variant Type</button>
          </div>
        </div>

        <div>
          <div class="admin-panel">
            <h3>Category *</h3>
            <div class="filter-group">
              <label><input type="radio" name="fCategoryRadio" value="gift-ideas" onclick="document.getElementById('fCategory').value='gift-ideas'" checked> 🎁 Gift Ideas</label>
            </div>
            <input type="hidden" id="fCategory" value="gift-ideas">
          </div>

          <div class="admin-panel">
            <h3>Visibility &amp; Flags</h3>
            <div class="checkbox-row"><input type="checkbox" id="fFeatured"><label>Mark as Featured</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fOffer"><label>Mark as Special Offer</label></div>
            <div class="checkbox-row"><input type="checkbox" id="fPublished"><label>Published (visible to customers)</label></div>
          </div>

          <button type="submit" class="btn btn-gold btn-block">Save Product</button>
        </div>
      </div>
    </form>
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  initAdminAddProductPage();
  // sync category radio with hidden field & existing value on load
  setTimeout(() => {
    const cat = document.getElementById('fCategory').value;
    document.querySelectorAll('input[name=fCategoryRadio]').forEach(r => r.checked = (r.value === cat));
  }, 50);
</script>
</body>
</html>
