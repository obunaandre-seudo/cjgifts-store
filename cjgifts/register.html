<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/js/transition.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create Your Account</h2>
    <p class="sub">Join CJ Gifts to track orders and check out faster.</p>
    <div class="form-error" id="registerError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="registerForm">
      <div class="form-group"><label>Full Name</label><input id="regName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" required minlength="6"></div>
      <button type="submit" class="btn btn-gold btn-block">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderLayout('');
  initRegisterPage();
</script>
</body>
</html>
