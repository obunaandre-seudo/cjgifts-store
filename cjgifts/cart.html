<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>Your Cart</h1>
    <div class="crumb"><a href="index.html">Home</a> / Cart</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="cart-wrap" id="cartWrap" style="display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:flex-start;">
      <div>
        <table class="cart-table">
          <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th></tr></thead>
          <tbody id="cartItemsBody"></tbody>
        </table>
        <div style="margin-top:20px;">
          <a href="shop.html" class="btn btn-outline">← Continue Shopping</a>
        </div>
      </div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Discount</span><span class="promo-badge" id="sumDiscount">-$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sumShipping">Free</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
        <a href="checkout.html" class="btn btn-gold btn-block" style="margin-top:18px;">Proceed to Checkout</a>
      </div>
    </div>

    <div class="empty-state" id="cartEmpty" style="display:none;">
      <div class="icon">🛒</div>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added anything yet. Let's fix that.</p>
      <a href="shop.html" class="btn btn-gold">Start Shopping</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderLayout('shop');
  initCartPage();
</script>
</body>
</html>
