<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/js/transition.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Gifts — CJ Gifts</title>
<meta name="description" content="This legacy address now forwards to the CJ Gifts collection.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>Shop Gifts</h1>
    <div class="crumb"><a href="index.html">Home</a> / Gifts</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="shop-layout">
      <aside class="filters-panel">
        <h4>Price</h4>
        <div class="filter-group">
          <div class="price-range">
            <input type="number" id="minPrice" placeholder="Min">
            <input type="number" id="maxPrice" placeholder="Max">
          </div>
        </div>
        <h4>Availability</h4>
        <div class="filter-group">
          <label><input type="checkbox" id="filterAvailability"> In stock only</label>
        </div>
        <h4>Highlights</h4>
        <div class="filter-group">
          <label><input type="checkbox" id="filterFeatured"> Featured</label>
          <label><input type="checkbox" id="filterOffer"> Special Offer</label>
        </div>
        <button class="btn btn-outline btn-block btn-sm" id="clearFilters">Clear Filters</button>
      </aside>
      <div>
        <div class="toolbar">
          <input type="search" id="toolbarSearch" placeholder="Search products..." style="min-width:220px;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="result-count" id="resultCount"></span>
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name</option>
              <option value="popular">Popular</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderLayout('products');
  window.location.replace('shop.html');
</script>
</body>
</html>
