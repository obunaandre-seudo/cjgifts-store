<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — CJ Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1 id="crumbTitle">Product</h1>
    <div class="crumb"><a href="index.html">Home</a> / <a id="pdCategory" href="shop.html">Category</a></div>
  </div>
</div>

<section class="section" id="productDetailWrap">
  <div class="container">
    <div class="pd-grid">
      <div>
        <div class="pd-gallery-main"><img id="pdMainImg" src="" alt=""></div>
        <div class="pd-thumbs" id="pdThumbs"></div>
      </div>
      <div>
        <div class="pd-title" id="pdTitle" style="font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);margin:8px 0 12px;"></div>
        <div class="pd-price" id="pdPrice"></div>
        <div id="pdStockMsg"></div>
        <p class="pd-desc" id="pdDesc"></p>
        <div class="pd-meta">
          <span>SKU: <b id="pdSku"></b></span>
          <span>Stock: <b id="pdStockCount"></b> available</span>
        </div>
        <div id="pdVariants"></div>
        <div class="variant-block">
          <h5>Quantity</h5>
          <div class="qty-selector">
            <button type="button" id="qtyMinus">&minus;</button>
            <input id="qtyInput" value="1">
            <button type="button" id="qtyPlus">&plus;</button>
          </div>
        </div>
        <div class="pd-actions">
          <button class="btn btn-navy" id="addToCartBtn">Add to Cart</button>
          <button class="btn btn-gold" id="buyNowBtn">Buy Now</button>
        </div>
        <p style="font-size:13px;color:var(--gray-600);">🔒 Secure checkout · 🚚 Free shipping over $75 · ↩ Easy 30-day returns</p>
      </div>
    </div>

    <div id="relatedSection" style="margin-top:70px;">
      <div class="section-head reveal">
        <span class="eyebrow">You might also like</span>
        <h2>Related Products</h2>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </div>
</section>

<section class="section" id="productNotFound" style="display:none;">
  <div class="container">
    <div class="empty-state">
      <div class="icon">❌</div>
      <h3>Product Not Available</h3>
      <p>This product could not be found, or is no longer available.</p>
      <a href="shop.html" class="btn btn-gold">Continue Shopping</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderLayout('shop');
  initProductPage();
</script>
</body>
</html>
