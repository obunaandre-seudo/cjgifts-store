<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — BPoint Gift Store</title>
<meta name="description" content="Get in touch with the BPoint Gift Store team.">
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>Contact Us</h1>
    <div class="crumb"><a href="index.html">Home</a> / Contact</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="checkout-grid">
      <div class="admin-panel">
        <h3>Send Us a Message</h3>
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input required></div>
            <div class="form-group"><label>Email</label><input type="email" required></div>
          </div>
          <div class="form-group"><label>Subject</label><input required></div>
          <div class="form-group"><label>Message</label><textarea rows="5" required></textarea></div>
          <button type="submit" class="btn btn-gold">Send Message</button>
        </form>
      </div>
      <div>
        <div class="admin-panel">
          <h3>Get in Touch</h3>
          <p style="margin-bottom:16px;">📧 support@bpointgifts.com</p>
          <p style="margin-bottom:16px;">📞 +1 (555) 010-2024</p>
          <p style="margin-bottom:16px;">📍 123 Commerce Avenue, Suite 200, Your City</p>
          <p>🕐 Mon–Fri: 9am–6pm · Sat: 10am–4pm</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="assets/js/app.js?v=3"></script>
<script>
  renderLayout('contact');
  initContactPage();
</script>
</body>
</html>
