<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BPoint Gift Store</title>
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2 id="loginHeading">Welcome Back</h2>
    <p class="sub" id="loginDescription">Log in to view your orders and account details.</p>
    <div class="form-error" id="loginError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-gold btn-block">Login</button>
    </form>
    <div class="auth-switch" id="customerAuthSwitch">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="assets/js/app.js?v=3"></script>
<script>
  renderLayout('');
  initLoginPage();
</script>
</body>
</html>
