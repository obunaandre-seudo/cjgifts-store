<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BPoint Gift Store</title>
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body>
<div id="site-header"></div>

<div class="auth-wrap login-wrap">
  <div class="auth-card login-card">
    <a class="login-brand" href="index.html" aria-label="BPoint Gift Store home">
      <img src="assets/images/bpoint-logo.svg" alt="" width="44" height="44">
      <span>BPoint <em>Gifts</em></span>
    </a>
    <span class="login-eyebrow">A little luxury, just for you</span>
    <h2 id="loginHeading">Welcome Back</h2>
    <p class="sub" id="loginDescription">Log in to view your orders and account details.</p>
    <div class="form-error" id="loginError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Show password" aria-pressed="false" aria-controls="loginPassword">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 3-.4"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Login</button>
    </form>
    <div class="auth-switch" id="customerAuthSwitch">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/layout.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script>
  renderLayout('');
  initLoginPage();
</script>
</body>
</html>
