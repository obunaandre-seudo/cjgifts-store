<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — BPoint Gift Store</title>
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create Your Account</h2>
    <p class="sub">Join BPoint Gift Store to track orders and check out faster.</p>
    <div class="form-error" id="registerError" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <form id="registerForm">
      <div class="form-group"><label>Full Name</label><input id="regName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" autocomplete="tel"></div>
      <div class="form-group"><label>Street Address</label><input id="regAddress" autocomplete="street-address"></div>
      <div class="form-row">
        <div class="form-group"><label>City</label><input id="regCity" autocomplete="address-level2"></div>
        <div class="form-group"><label>State / Region</label><input id="regState" autocomplete="address-level1"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Country</label><input id="regCountry" autocomplete="country-name"></div>
        <div class="form-group"><label>Postal Code</label><input id="regPostal" autocomplete="postal-code"></div>
      </div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" required minlength="6"></div>
      <button type="submit" class="btn btn-gold btn-block">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="assets/js/app.js?v=3"></script>
<script>
  renderLayout('');
  initRegisterPage();
</script>
</body>
</html>
