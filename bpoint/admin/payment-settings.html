<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Settings — BPoint Gift Store Admin</title>
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="../assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="../assets/css/style.css?v=8">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Payment Settings</h1></div>
    <div class="admin-panel">
      <p>Configure the bank account customers should use when paying by transfer. Existing orders keep their original account details.</p>
      <p id="paymentSettingsMessage" role="alert" style="color:#9b2c2c;" hidden></p>
      <form id="paymentSettingsForm">
        <div class="form-group">
          <label><input type="checkbox" name="bankTransferEnabled"> Enable bank transfer at checkout</label>
        </div>
        <div class="form-group"><label for="bankName">Bank name</label><input id="bankName" name="bankName" maxlength="100"></div>
        <div class="form-group"><label for="accountName">Account name</label><input id="accountName" name="accountName" maxlength="100"></div>
        <div class="form-group"><label for="accountNumber">Account number</label><input id="accountNumber" name="accountNumber" inputmode="numeric" maxlength="34"></div>
        <button type="submit" class="btn btn-gold">Save Payment Settings</button>
      </form>
    </div>
  </main>
</div>
<script src="../assets/js/data.js?v=3"></script>
<script src="../assets/js/layout.js?v=4"></script>
<script src="../assets/js/app.js?v=4"></script>
<script src="../assets/js/admin.js?v=4"></script>
<script>initAdminPaymentSettingsPage();</script>
</body>
</html>
