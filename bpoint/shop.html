<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Gifts — BPoint Gift Store</title>
<meta name="description" content="Browse the full BPoint Gift Store catalog of thoughtfully selected gifts.">
<meta name="theme-color" content="#1b0b33">
<link rel="icon" type="image/svg+xml" href="assets/images/bpoint-logo.svg">
<link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>Shop Gifts</h1>
    <div class="crumb"><a href="index.html">Home</a> / Shop</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="shop-layout">
      <aside class="filters-panel">
        <h4>Category</h4>
        <div class="filter-group" id="catFilterWrap">
          <label><input type="checkbox" value="gift-ideas"> 🎁 Gift Ideas</label>
        </div>
        <h4>Price</h4>
        <div class="filter-group">
          <div class="price-range">
            <input type="number" id="minPrice" placeholder="Min">
            <input type="number" id="maxPrice" placeholder="Max">
          </div>
        </div>
        <h4>Availability</h4>
        <div class="filter-group">
          <label><input type="checkbox" id="filterAvailability"> In stock only</label>
        </div>
        <h4>Highlights</h4>
        <div class="filter-group">
          <label><input type="checkbox" id="filterFeatured"> Featured</label>
          <label><input type="checkbox" id="filterOffer"> Special Offer</label>
        </div>
        <button class="btn btn-outline btn-block btn-sm" id="clearFilters">Clear Filters</button>
      </aside>
      <div>
        <div class="toolbar">
          <input type="search" id="toolbarSearch" placeholder="Search gifts, SKU..." style="min-width:220px;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="result-count" id="resultCount"></span>
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name">Name</option>
              <option value="popular">Popular</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/layout.js?v=4"></script>
<script src="assets/js/app.js?v=4"></script>
<script>
  renderLayout('shop');
  initShopPage(null);
</script>
</body>
</html>
